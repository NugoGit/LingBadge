name: Bug report
description: Something in the app or tooling doesn't work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where did you run the app?
      options: [GitHub Pages, Local file, Local server, claude.ai artifact, Not the app (tooling)]
  - type: input
    id: browser
    attributes:
      label: Browser and OS
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Don't paste API keys.
