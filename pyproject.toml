[project]
name = "lingbadge"
version = "0.5.0"
description = "Skill-based language certification: small real-life can-do skills, all-or-nothing badges, language packs as YAML"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.5", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lingbadge-validate = "lingbadge.validate:main"
lingbadge-check = "lingbadge.checks:main"
lingbadge-new-language = "lingbadge.scaffold:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
