  - Anna
  options:
  - Anna
  - Huber
  - Anna Huber
  - —
- id: name-3
  facet: name
  format: choice
  prompt:
    de: Sie haben nur einen Nachnamen. Was tun Sie mit dem Feld „Segundo apellido“?
    en: You have only one surname. What do you do with the field “Segundo apellido”?
  answer:
    de:
    - Leer lassen oder „—“ eintragen
    en:
    - Leave it empty or enter “—”
  options:
    de:
    - Leer lassen oder „—“ eintragen
    - Den Nachnamen der Mutter erfinden
    - Den Vornamen eintragen
    - Den Geburtsort eintragen
    en:
    - Leave it empty or enter “—”
    - Make up your mother's surname
    - Enter your first name
    - Enter your place of birth
