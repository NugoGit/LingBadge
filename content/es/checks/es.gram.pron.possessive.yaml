# Draft catalogue (peninsular Spanish); see docs/question-catalogue.md.
enabler: es.gram.pron.possessive
lang: es
facets:
- id: singular
  band: core
  format: type
  rule: {de: 'mi, tu, su vor einem Substantiv im Singular (mi casa, tu libro, su coche)', en: 'mi, tu, su before a singular noun (mi casa, tu libro, su coche)'}
  instruction: {de: Setze den Possessivbegleiter ein. Die Person steht in Klammern., en: Put in the possessive. The person is in brackets.}
- id: plural
  band: variant
  format: type
  rule: {de: 'Plural des Besitzes: mis, tus, sus (mis padres, tus amigos)', en: 'Plural of what is owned: mis, tus, sus (mis padres, tus amigos)'}
  instruction: {de: Setze den Possessivbegleiter ein. Die Person steht in Klammern., en: Put in the possessive. The person is in brackets.}
- id: nuestro
  band: exception
  format: type
  rule: {de: 'nuestro und vuestro richten sich auch nach dem Genus: nuestra casa, nuestros hijos, vuestras maletas', en: 'nuestro and vuestro also agree in gender: nuestra casa, nuestros hijos, vuestras maletas'}
  instruction: {de: Setze den Possessivbegleiter ein. Die Person steht in Klammern., en: Put in the possessive. The person is in brackets.}
- id: tu-su
  band: contrast
  format: choice
  rule: {de: 'tu = dein (tú); su = Ihr (usted), sein, ihr', en: 'tu = your (tú); su = your (usted), his, her, their'}
  instruction: {de: 'Welche Form passt zur Situation?', en: 'Which form fits the situation?'}
