# Draft catalogue (peninsular Spanish); see docs/question-catalogue.md.
enabler: es.gram.adj.agreement
lang: es
facets:
- id: o-a
  band: core
  format: type
  rule: {de: 'Adjektive auf -o richten sich nach Genus und Zahl: alto, alta, altos, altas', en: 'Adjectives in -o agree in gender and number: alto, alta, altos, altas'}
  instruction: {de: Setze das Adjektiv in der richtigen Form ein., en: Put the adjective in the right form.}
- id: e-cons
  band: variant
  format: type
  rule: {de: 'Auf -e oder Konsonant: gleich für beide Genera, nur Plural (verde → verdes, azul → azules, feliz → felices)', en: 'In -e or a consonant: same for both genders, plural only (verde → verdes, azul → azules, feliz → felices)'}
  instruction: {de: Setze das Adjektiv in der richtigen Form ein., en: Put the adjective in the right form.}
- id: special
  band: exception
  format: type
  rule: {de: 'Herkunft auf Konsonant hat eine weibliche Form (alemán → alemana, español → española); bueno → buen vor maskulinem Substantiv', en: 'Nationality in a consonant has a feminine form (alemán → alemana, español → española); bueno → buen before
      a masculine noun'}
  instruction: {de: Setze das Adjektiv in der richtigen Form ein., en: Put the adjective in the right form.}
- id: mixed
  band: contrast
  format: type
  rule: {de: 'Gemischte Gruppen: maskuliner Plural (Ana y Pedro son altos)', en: 'Mixed groups: masculine plural (Ana y Pedro son altos)'}
  instruction: {de: Setze das Adjektiv in der richtigen Form ein., en: Put the adjective in the right form.}
