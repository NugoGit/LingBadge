# Draft catalogue (peninsular Spanish); see docs/question-catalogue.md.
enabler: es.gram.noun.gender
lang: es
facets:
- id: o-a
  band: core
  format: choice
  options: [el, la]
  rule: {de: 'Auf -o meist maskulin (el libro), auf -a meist feminin (la casa)', en: 'Nouns in -o are mostly masculine (el libro), in -a mostly feminine (la casa)'}
  instruction: {de: 'el oder la?', en: 'el or la?'}
- id: endings
  band: variant
  format: choice
  options: [el, la]
  rule: {de: '-ción, -dad, -tad sind feminin (la estación, la ciudad); -or meist maskulin (el ordenador); bei -e und Konsonant: lernen (el coche, la noche, el hotel, la flor)', en: '-ción, -dad, -tad are feminine (la estación, la ciudad); -or mostly masculine
      (el ordenador); with -e and consonants: learn them (el coche, la noche, el hotel, la flor)'}
  instruction: {de: 'el oder la?', en: 'el or la?'}
- id: exceptions
  band: exception
  format: choice
  options: [el, la]
  rule: {de: 'Ausnahmen: el día, el mapa, el problema, el idioma, el sofá, el tema; la mano, la foto, la moto, la radio', en: 'Exceptions: el día, el mapa, el problema, el idioma, el sofá, el tema; la mano, la foto, la moto, la radio'}
  instruction: {de: 'el oder la?', en: 'el or la?'}
- id: people
  band: contrast
  format: choice
  options: [el, la]
  rule: {de: 'Bei Personen auf -e, -ista, -nte entscheidet die Person: el/la estudiante, el/la turista', en: 'For people in -e, -ista, -nte the person decides: el/la estudiante, el/la turista'}
  instruction: {de: 'el oder la? Achte auf die Person.', en: 'el or la? Look at the person.'}
