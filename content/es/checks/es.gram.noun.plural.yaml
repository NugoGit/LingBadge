# Draft catalogue (peninsular Spanish); see docs/question-catalogue.md.
enabler: es.gram.noun.plural
lang: es
facets:
- id: vowel-s
  band: core
  format: type
  rule: {de: 'Auf Vokal: + -s (libro → libros, casa → casas, coche → coches)', en: 'Ending in a vowel: add -s (libro → libros, casa → casas, coche → coches)'}
  instruction: {de: Setze den Plural ein., en: Put in the plural.}
- id: cons-es
  band: variant
  format: type
  rule: {de: 'Auf Konsonant: + -es (ciudad → ciudades, tren → trenes); -z → -ces (lápiz → lápices, vez → veces)', en: 'Ending in a consonant: add -es (ciudad → ciudades, tren → trenes); -z → -ces (lápiz → lápices, vez → veces)'}
  instruction: {de: Setze den Plural ein., en: Put in the plural.}
- id: accent
  band: exception
  format: type
  rule: {de: 'Der Akzent wandert: canción → canciones, autobús → autobuses, inglés → ingleses, joven → jóvenes; lunes, crisis bleiben gleich', en: 'The accent moves: canción → canciones, autobús → autobuses, inglés → ingleses, joven → jóvenes; lunes, crisis
      stay the same'}
  instruction: {de: Setze den Plural ein. Achte auf den Akzent., en: Put in the plural. Watch the accent.}
- id: stressed-vowel
  band: contrast
  format: type
  rule: {de: 'Betonter Vokal am Ende: meist nur -s (café → cafés, sofá → sofás, menú → menús)', en: 'Stressed final vowel: usually just -s (café → cafés, sofá → sofás, menú → menús)'}
  instruction: {de: Setze den Plural ein., en: Put in the plural.}
