  format: type
  rule: {de: 'vosotros (Spanien) mit Akzent: habláis, coméis, vivís', en: 'vosotros (Spain) with an accent: habláis, coméis, vivís'}
  instruction: {de: Setze das Verb im Präsens ein (vosotros)., en: Put the verb in the present tense (vosotros).}
- id: usted
  band: contrast
  format: type
  rule: {de: 'usted / ustedes stehen mit der 3. Person: usted habla, ustedes viven', en: 'usted / ustedes take the 3rd person: usted habla, ustedes viven'}
  instruction: {de: Setze das Verb im Präsens ein., en: Put the verb in the present tense.}
