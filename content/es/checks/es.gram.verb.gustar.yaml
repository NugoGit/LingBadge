# Draft catalogue (peninsular Spanish); see docs/question-catalogue.md.
enabler: es.gram.verb.gustar
lang: es
facets:
- id: gusta-gustan
  band: core
  format: choice
  options: [gusta, gustan]
  rule: {de: 'gustar richtet sich nach dem, was gefällt: me gusta el cine, me gustan los libros', en: 'gustar agrees with the thing liked: me gusta el cine, me gustan los libros'}
  instruction: {de: 'gusta oder gustan?', en: 'gusta or gustan?'}
- id: pronoun
  band: variant
  format: choice
  options: [me, te, le, nos]
  rule: {de: 'Die Person steht im Dativ: (a mí) me, (a ti) te, (a él / ella / usted) le, (a nosotros) nos', en: 'The person is the indirect object: (a mí) me, (a ti) te, (a él / ella / usted) le, (a nosotros) nos'}
  instruction: {de: 'Welches Pronomen passt?', en: 'Which pronoun fits?'}
- id: infinitive
  band: exception
  format: choice
  options: [gusta, gustan, encanta, encantan]
  rule: {de: 'Mit Infinitiv immer Singular, auch bei mehreren: me gusta leer y nadar; encantar funktioniert gleich', en: 'With an infinitive always singular, even several: me gusta leer y nadar; encantar works the same way'}
  instruction: {de: 'Welche Form passt?', en: 'Which form fits?'}
- id: tambien
  band: contrast
  format: choice
  options: [también, tampoco]
  rule: {de: 'Zustimmung zu positiv: a mí también; zu negativ: a mí tampoco', en: 'Agreeing with a positive: a mí también; with a negative: a mí tampoco'}
  instruction: {de: 'también oder tampoco?', en: 'también or tampoco?'}
