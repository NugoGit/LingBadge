# Draft catalogue (peninsular Spanish); see docs/question-catalogue.md.
enabler: es.gram.verb.present-irregular
lang: es
facets:
- id: core-verbs
  band: core
  format: type
  rule: {de: 'ser: soy, eres, es …; estar: estoy, estás, está …; tener: tengo, tienes, tiene …; ir: voy, vas, va, vamos, vais, van', en: 'ser: soy, eres, es …; estar: estoy, estás, está …; tener: tengo, tienes, tiene …; ir: voy, vas, va, vamos, vais, van'}
  instruction: {de: Setze das Verb im Präsens ein., en: Put the verb in the present tense.}
- id: stem-change
  band: variant
  format: type
  rule: {de: 'Stammwechsel in betonter Silbe: e → ie (quiero), o → ue (puedo), e → i (pido)', en: 'Stem change in the stressed syllable: e → ie (quiero), o → ue (puedo), e → i (pido)'}
  instruction: {de: Setze das Verb im Präsens ein., en: Put the verb in the present tense.}
- id: yo-form
  band: exception
  format: type
  rule: {de: 'Unregelmäßige yo-Form: hago, salgo, pongo, vengo, digo, conozco, sé, veo, doy', en: 'Irregular yo form: hago, salgo, pongo, vengo, digo, conozco, sé, veo, doy'}
  instruction: {de: Setze das Verb im Präsens ein (yo)., en: Put the verb in the present tense (yo).}
- id: no-change
  band: contrast
  format: type
  rule: {de: 'Kein Stammwechsel bei nosotros und vosotros: podemos, queremos, dormimos (aber: puedo, quiero, duermo)', en: 'No stem change with nosotros and vosotros: podemos, queremos, dormimos (but: puedo, quiero, duermo)'}
  instruction: {de: Setze das Verb im Präsens ein., en: Put the verb in the present tense.}
