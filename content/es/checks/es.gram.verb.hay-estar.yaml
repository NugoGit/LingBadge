# Draft catalogue (peninsular Spanish); see docs/question-catalogue.md.
enabler: es.gram.verb.hay-estar
lang: es
facets:
- id: hay-vs-esta
  band: core
  format: choice
  options: [hay, está]
  rule: {de: 'hay + un/una/Zahl/ohne Artikel: es gibt (hay un banco); está + el/la/Name: wo es ist (el banco está allí)', en: 'hay + un/una/number/no article: there is (hay un banco); está + el/la/name: where it is (el banco está allí)'}
  instruction: {de: 'hay oder está?', en: 'hay or está?'}
- id: plural
  band: variant
  format: choice
  options: [hay, están]
  rule: {de: hay bleibt im Plural gleich (hay dos bancos); estar wird zu están (los bancos están allí), en: hay stays the same in the plural (hay dos bancos); estar becomes están (los bancos están allí)}
  instruction: {de: 'hay oder están?', en: 'hay or están?'}
- id: no-article
  band: exception
  format: choice
  options: [hay, está, están]
  rule: {de: 'hay auch ohne Artikel und mit Mengen: hay pan, hay mucha gente, ¿hay wifi?', en: 'hay also without article and with quantities: hay pan, hay mucha gente, ¿hay wifi?'}
  instruction: {de: 'hay, está oder están?', en: 'hay, está or están?'}
- id: question
  band: contrast
  format: choice
  options: [hay, está]
  rule: {de: '¿Hay un/una …? fragt, ob es etwas gibt; ¿Dónde está el/la …? fragt nach dem Ort von etwas Bekanntem', en: '¿Hay un/una …? asks whether something exists; ¿Dónde está el/la …? asks where something known is'}
  instruction: {de: 'hay oder está?', en: 'hay or está?'}
