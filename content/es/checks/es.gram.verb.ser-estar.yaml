# Draft catalogue (peninsular Spanish); see docs/question-catalogue.md.
enabler: es.gram.verb.ser-estar
lang: es
facets:
- id: identity-place
  band: core
  format: choice
  rule: {de: 'ser: wer/was/woher (soy Ana, soy médica, soy de Viena); estar: wo (estoy en casa)', en: 'ser: who/what/where from (soy Ana, soy médica, soy de Viena); estar: where (estoy en casa)'}
  instruction: {de: 'ser oder estar?', en: 'ser or estar?'}
- id: trait-state
  band: variant
  format: choice
  rule: {de: 'ser für Eigenschaften (es alto, es simpática); estar für Zustände und Befinden (está cansado, estoy bien)', en: 'ser for characteristics (es alto, es simpática); estar for states and how someone is (está cansado, estoy bien)'}
  instruction: {de: 'ser oder estar?', en: 'ser or estar?'}
- id: fixed
  band: exception
  format: choice
  rule: {de: 'Uhrzeit, Tag, Datum, Preis mit ser (son las tres, hoy es lunes); wo ein Ereignis stattfindet auch mit ser (la fiesta es en mi casa)', en: 'Time, day, date, price with ser (son las tres, hoy es lunes); where an event takes place also with
      ser (la fiesta es en mi casa)'}
  instruction: {de: 'ser oder estar?', en: 'ser or estar?'}
- id: same-adj
  band: contrast
  format: choice
  rule: {de: 'Gleiches Adjektiv, anderer Sinn: la sopa está fría (gerade) / el hielo es frío (immer); está guapa hoy / es guapa', en: 'Same adjective, different meaning: la sopa está fría (now) / el hielo es frío (always); está guapa hoy / es guapa'}
  instruction: {de: 'ser oder estar?', en: 'ser or estar?'}
