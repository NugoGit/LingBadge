# Draft catalogue (peninsular Spanish); see docs/question-catalogue.md.
enabler: es.num.time
lang: es
facets:
- id: hours
  band: core
  format: type
  rule: {de: Son las + Zahl ab zwei (son las tres); Es la una, en: Son las + number from two (son las tres); Es la una}
  instruction: {de: Schreibe die Zahl als Wort., en: Write the number as a word.}
- id: minutes
  band: variant
  format: choice
  options: [y cuarto, y media, menos cuarto]
  rule: {de: 'y cuarto (:15), y media (:30), menos cuarto (:45 vor der nächsten Stunde)', en: 'y cuarto (:15), y media (:30), menos cuarto (:45 before the next hour)'}
  instruction: {de: 'Welche Angabe passt zur Uhrzeit?', en: 'Which phrase matches the time?'}
- id: la-una
  band: exception
  format: choice
  options: [Es la, Son las]
  rule: {de: '1 Uhr ist Singular: es la una (y media); sonst Plural: son las dos', en: '1 o''clock is singular: es la una (y media); otherwise plural: son las dos'}
  instruction: {de: 'Es la oder Son las?', en: 'Es la or Son las?'}
- id: a-las
  band: contrast
  format: choice
  options: [Son las, A las]
  rule: {de: '¿Qué hora es? → Son las … (jetzt); ¿A qué hora …? → A las … (wann)', en: '¿Qué hora es? → Son las … (now); ¿A qué hora …? → A las … (when)'}
  instruction: {de: 'Son las oder A las?', en: 'Son las or A las?'}
