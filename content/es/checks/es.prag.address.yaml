# Draft catalogue (peninsular Spanish); see docs/question-catalogue.md.
enabler: es.prag.address
lang: es
facets:
- id: tu-usted
  band: core
  format: choice
  options: [tú, usted]
  rule: {de: 'tú mit Familie, Freunden, Kindern und meist mit Gleichaltrigen; usted mit Fremden im Service, Älteren, im Amt', en: 'tú with family, friends, children and usually people your age; usted with strangers in service, older people, officials'}
  instruction: {de: 'tú oder usted?', en: 'tú or usted?'}
- id: verb-form
  band: variant
  format: choice
  rule: {de: 'Das Verb folgt der Anrede: tú puedes, usted puede; tú tienes, usted tiene', en: 'The verb follows the form of address: tú puedes, usted puede; tú tienes, usted tiene'}
  instruction: {de: 'Welche Form passt zur Situation?', en: 'Which form fits the situation?'}
- id: imperative
  band: exception
  format: choice
  rule: {de: 'Feste Aufforderungen haben zwei Formen: perdona / perdone, oye / oiga, pasa / pase', en: 'Fixed requests have two forms: perdona / perdone, oye / oiga, pasa / pase'}
  instruction: {de: 'Welche Form passt zur Situation?', en: 'Which form fits the situation?'}
- id: senor
  band: contrast
  format: choice
  options: [señor, señora, don, doña]
  rule: {de: señor / señora + Nachname (señora García); don / doña + Vorname (doña Carmen), en: señor / señora + surname (señora García); don / doña + first name (doña Carmen)}
  instruction: {de: 'Welche Anrede passt?', en: 'Which title fits?'}
items:
