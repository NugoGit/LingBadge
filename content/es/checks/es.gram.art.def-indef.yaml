# Draft catalogue (peninsular Spanish); see docs/question-catalogue.md.
enabler: es.gram.art.def-indef
lang: es
facets:
- id: definite
  band: core
  format: choice
  options: [el, la, los, las]
  rule: {de: 'Bestimmter Artikel nach Genus und Zahl: el libro, la mesa, los libros, las mesas', en: 'Definite article by gender and number: el libro, la mesa, los libros, las mesas'}
  instruction: {de: 'Welcher Artikel passt?', en: 'Which article fits?'}
- id: indefinite
  band: variant
  format: choice
  options: [un, una, unos, unas]
  rule: {de: 'Unbestimmter Artikel: un coche, una casa, unos amigos, unas amigas', en: 'Indefinite article: un coche, una casa, unos amigos, unas amigas'}
  instruction: {de: 'Welcher Artikel passt?', en: 'Which article fits?'}
- id: contraction
  band: exception
  format: type
  rule: {de: 'a + el = al, de + el = del (aber: a la, de la); el agua, el aula: feminin, aber el', en: 'a + el = al, de + el = del (but: a la, de la); el agua, el aula: feminine, but el'}
  instruction: {de: Setze die richtige Form ein., en: Put in the right form.}
- id: def-vs-indef
  band: contrast
  format: choice
  rule: {de: 'Neues, Unbekanntes oder „ein beliebiges“: un/una (¿Hay una farmacia?); Bekanntes oder Eindeutiges: el/la (¿Dónde está la estación?)', en: 'New, unknown or ''any'': un/una (¿Hay una farmacia?); known or unique: el/la (¿Dónde está la estación?)'}
  instruction: {de: 'Bestimmt oder unbestimmt?', en: 'Definite or indefinite?'}
