- خوبم، مرسی. شما چطورید؟ (khubam, mersi. shomā chetorid?)
- ممنون! — خواهش می‌کنم. (mamnun! — khāhesh mikonam.)
- ببخشید! — اشکالی نداره. (bebakhshid! — eshkāli nadāre.)
- خداحافظ! (khodāhāfez!)
