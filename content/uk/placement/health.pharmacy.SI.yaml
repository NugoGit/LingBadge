items:
- id: problem-1
  facet: problem
  format: type
  prompt:
    de: 'Sagen Sie: Ich habe Zahnschmerzen.'
    en: 'Say: I have toothache.'
  stem: У мене болить ___.
  cue:
    de: Zahn
    en: tooth
  answer:
  - зуб
- id: problem-2
  facet: problem
  format: type
  prompt:
    de: 'Sagen Sie: Ich habe Schnupfen.'
    en: 'Say: I have a cold.'
  stem: У мене ___.
  answer:
  - нежить
- id: problem-3
  facet: problem
  format: choice
  prompt:
    de: 'Sagen Sie: Mein Kind hat Fieber.'
    en: 'Say: My child has a temperature.'
  answer:
  - У моєї дитини температура.
  options:
  - У моєї дитини температура.
  - У мій дитина температура.
  - Моя дитина температуру.
  - У дитину температура.
- id: ask-1
  facet: ask
  format: type
  prompt:
    de: Verlangen Sie etwas gegen Husten.
    en: Ask for something for a cough.
  stem: Дайте, будь ласка, щось від ___.
  cue: кашель
  answer:
  - кашлю
- id: ask-2
  facet: ask
  format: type
  prompt:
    de: Verlangen Sie etwas gegen Kopfschmerzen.
    en: Ask for something for a headache.
  stem: Щось від головного ___, будь ласка.
  cue: біль
  answer:
  - болю
- id: ask-3
  facet: ask
  format: choice
  prompt:
    de: Fragen Sie, wie man das Medikament einnimmt.
    en: Ask how to take the medicine.
  answer:
  - Як це приймати?
  options:
  - Як це приймати?
  - Як це називається?
  - Скільки це коштує?
  - Де аптека?
- id: dose-1
  facet: dose
  format: choice
  prompt:
    de: Wie oft sollen Sie das nehmen?
    en: How often should you take it?
  context: Приймайте тричі на день після їжі.
  answer:
    de:
    - Dreimal täglich
    en:
    - Three times a day
  options:
    de:
    - Dreimal täglich
    - Dreimal pro Woche
    - Alle drei Stunden
    - Drei Tage lang
    en:
    - Three times a day
    - Three times a week
    - Every three hours
    - For three days
- id: dose-2
  facet: dose
  format: choice
  prompt:
    de: Was sollen Sie tun?
    en: What should you do?
  context: По одній таблетці вранці й увечері.
  answer:
    de:
    - Morgens und abends je eine Tablette
    en:
    - One tablet morning and evening
  options:
    de:
    - Morgens und abends je eine Tablette
    - Eine Tablette am Tag
    - Morgens zwei Tabletten
    - Abends zwei Tabletten
    en:
    - One tablet morning and evening
    - One tablet a day
    - Two tablets in the morning
    - Two tablets in the evening
- id: dose-3
  facet: dose
  format: choice
  prompt:
    de: Wann sollen Sie die Tropfen nehmen?
    en: When should you take the drops?
  context: Ці краплі — перед сном.
  answer:
    de:
    - Vor dem Schlafengehen
    en:
    - Before going to bed
  options:
    de:
    - Vor dem Schlafengehen
    - Vor dem Essen
    - Nach dem Aufstehen
    - Nach dem Essen
    en:
    - Before going to bed
    - Before meals
    - After getting up
    - After meals
