    - Nach drei Haltestellen, bei der Universität
    en:
    - After three stops, at the university
  options:
    de:
    - Nach drei Haltestellen, bei der Universität
    - Nach neun Haltestellen
    - An der Endstation
    - Bei der Universität, nach einer Haltestelle
