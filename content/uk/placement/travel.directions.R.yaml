  prompt:
    de: Wo steigen Sie aus?
    en: Where do you get off?
  text: Виходь на станції «Золоті ворота». Іди прямо до кафе, потім ліворуч. Мій будинок — третій праворуч, квартира 12.
  answer:
    de:
    - An der Station „Goldene Tore“
    en:
    - At the station “Golden Gate”
  options:
    de:
    - An der Station „Goldene Tore“
    - An der Endstation
    - Beim Café
    - An der dritten Station
    en:
    - At the station “Golden Gate”
    - At the last stop
    - At the café
    - At the third station
- id: transport-2
  facet: transport
  format: type
  prompt:
    de: Welchen Bus nehmen Sie? (Zahl)
    en: Which bus do you take? (number)
  text: Сідай на автобус номер 24. Виходь на зупинці «Ринок». Перейди дорогу, наш офіс — на другому поверсі.
  answer:
  - '24'
- id: transport-3
  facet: transport
  format: choice
  prompt:
    de: Wo steigen Sie aus?
    en: Where do you get off?
  text: Сідай на тролейбус номер 9 і їдь три зупинки. Виходь біля університету.
  answer:
