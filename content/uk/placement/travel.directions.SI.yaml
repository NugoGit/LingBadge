    en:
    - Five minutes on foot
    - Five minutes by bus
    - Five kilometres
    - It's far
- id: follow-3
  facet: follow
  format: choice
  prompt:
    de: Was wird gesagt?
    en: What is said?
  context: Це далеко. Краще їдьте на метро.
  answer:
    de:
    - Es ist weit, nehmen Sie die Metro
    en:
    - It's far, take the metro
  options:
    de:
    - Es ist weit, nehmen Sie die Metro
    - Es ist nah, gehen Sie zu Fuß
