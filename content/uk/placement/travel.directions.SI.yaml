- id: follow-1
  facet: follow
  format: choice
  prompt:
    de: Was sollen Sie tun?
    en: What should you do?
  context: Ідіть прямо, потім праворуч.
  answer:
    de:
    - Geradeaus, dann rechts
    en:
    - Straight on, then right
  options:
    de:
    - Geradeaus, dann rechts
    - Geradeaus, dann links
    - Rechts, dann geradeaus
    - Zurück, dann rechts
    en:
    - Straight on, then right
    - Straight on, then left
    - Right, then straight on
    - Back, then right
- id: follow-2
  facet: follow
  format: choice
  prompt:
    de: Wie weit ist es?
    en: How far is it?
