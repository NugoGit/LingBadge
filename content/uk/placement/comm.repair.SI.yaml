skill: comm.repair.SI
lang: uk
reviewed_by: []
facets:
- id: not
  label:
    de: Sagen, dass man nicht verstanden hat
    en: Say that you didn't understand
- id: repeat
  label:
    de: Um Wiederholung oder langsameres Sprechen bitten
    en: Ask someone to repeat or speak more slowly
- id: spell
  label:
    de: Nach der Schreibweise fragen
    en: Ask how something is spelt
items:
- id: not-1
  facet: not
  format: type
  prompt:
    de: 'Sagen Sie: Entschuldigung, ich habe nicht verstanden.'
    en: 'Say: Sorry, I didn''t understand.'
  stem: Вибачте, я не ___.
  cue: зрозуміти (Vergangenheit)
  answer:
  - зрозумів
  - зрозуміла
- id: not-2
  facet: not
  format: choice
  prompt:
    de: Sie haben nichts verstanden. Was sagen Sie?
    en: You understood nothing. What do you say?
  context: Вам потрібна довідка з місця проживання.
  answer:
  - Вибачте, я не розумію.
  options:
  - Вибачте, я не розумію.
  - Так, звичайно.
  - Дякую, все добре.
  - До побачення.
- id: not-3
  facet: not
  format: choice
  prompt:
    de: 'Ein Mann sagt: „Ich habe nicht verstanden.“ Welche Form ist richtig?'
    en: 'A man says: “I didn''t understand.” Which form is correct?'
  answer:
  - Я не зрозумів.
  options:
  - Я не зрозумів.
  - Я не зрозуміла.
  - Я не зрозуміло.
- id: repeat-1
  facet: repeat
  format: type
  prompt:
    de: Bitten Sie höflich (Sie-Form), es zu wiederholen.
    en: Ask politely (formal) for it to be repeated.
  stem: ___, будь ласка.
  cue: повторити
  answer:
  - Повторіть
- id: repeat-2
  facet: repeat
  format: type
  prompt:
    de: Bitten Sie, langsamer zu sprechen.
    en: Ask someone to speak more slowly.
  stem: Говоріть ___, будь ласка.
  cue: повільно
  answer:
  - повільніше
- id: repeat-3
  facet: repeat
  format: choice
  prompt:
    de: Ihre Freundin spricht zu schnell. Was sagen Sie?
    en: Your friend (female) speaks too fast. What do you say?
  answer:
  - Говори повільніше, будь ласка.
  options:
  - Говори повільніше, будь ласка.
  - Говори швидше, будь ласка.
  - Я говорю повільно.
  - Ти говориш українською?
- id: spell-1
  facet: spell
  format: type
  prompt:
    de: Fragen Sie, wie man das schreibt.
    en: Ask how to write it.
  stem: Як це ___?
  answer:
  - пишеться
- id: spell-2
  facet: spell
  format: choice
  prompt:
    de: Sie wollen den Namen aufschreiben. Was fragen Sie?
    en: You want to write the name down. What do you ask?
  context: Моє прізвище — Шевчук.
  answer:
  - Як це пишеться?
  options:
  - Як це пишеться?
  - Як це називається?
  - Що це означає?
  - Де ви живете?
- id: spell-3
  facet: spell
  format: choice
  prompt:
    de: Sie buchstabieren den Namen „Ліна“. Welche Folge ist richtig?
    en: You spell the name “Ліна”. Which sequence is correct?
  answer:
  - ел, і, ен, а
  options:
  - ел, і, ен, а
  - ел, и, ен, а
  - ел, ї, ен, а
