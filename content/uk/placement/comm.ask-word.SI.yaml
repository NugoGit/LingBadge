skill: comm.ask-word.SI
lang: uk
reviewed_by: []
facets:
- id: name
  label:
    de: Fragen, wie etwas heißt
    en: Ask what something is called
- id: meaning
  label:
    de: Fragen, was ein Wort bedeutet
    en: Ask what a word means
- id: say
  label:
    de: Fragen, wie man etwas sagt; auf etwas zeigen
    en: Ask how to say something; point at something
items:
- id: name-1
  facet: name
  format: choice
  prompt:
    de: Sie zeigen auf einen Gegenstand und wollen wissen, wie er auf Ukrainisch heißt. Was fragen Sie?
    en: You point at an object and want to know its Ukrainian name. What do you ask?
  answer:
  - Як це називається українською?
  options:
  - Як це називається українською?
  - Як вас звати?
  - Скільки це коштує?
  - Де це?
- id: name-2
  facet: name
  format: type
  prompt:
    de: 'Ergänzen Sie: Wie heißt das auf Ukrainisch?'
    en: 'Complete: What is this called in Ukrainian?'
  stem: Як це ___ українською?
  answer:
  - називається
- id: name-3
  facet: name
  format: type
  prompt:
    de: 'Ergänzen Sie: Wie heißt das auf Ukrainisch?'
    en: 'Complete: What is this called in Ukrainian?'
  stem: Як це називається ___?
  cue: українська мова
  answer:
  - українською
  - по-українськи
- id: meaning-1
  facet: meaning
  format: choice
  prompt:
    de: Sie hören das Wort „сніданок“ und verstehen es nicht. Was fragen Sie?
    en: You hear the word “сніданок” and don't understand it. What do you ask?
  answer:
  - Що означає слово «сніданок»?
  options:
  - Що означає слово «сніданок»?
  - Як пишеться «сніданок»?
  - Де сніданок?
  - Коли сніданок?
- id: meaning-2
  facet: meaning
  format: type
  prompt:
    de: 'Ergänzen Sie: Was bedeutet das Wort „вокзал“?'
    en: 'Complete: What does the word “вокзал” mean?'
  stem: Що ___ слово «вокзал»?
  answer:
  - означає
- id: meaning-3
  facet: meaning
  format: choice
  prompt:
    de: Sie kennen das Wort nicht. Welche Reaktion passt?
    en: You don't know the word. Which reaction fits?
  context: Це квитанція.
  answer:
  - Вибачте, а що це означає?
  options:
  - Вибачте, а що це означає?
  - Дякую, не треба.
  - Добре, до побачення.
  - Так, я теж.
- id: say-1
  facet: say
  format: type
  prompt:
    de: 'Ergänzen Sie: Wie sagt man „Danke“ auf Ukrainisch?'
    en: 'Complete: How do you say “Danke” in Ukrainian?'
  stem: Як ___ «Danke» українською?
  answer:
  - сказати
- id: say-2
  facet: say
  format: choice
  prompt:
    de: Sie zeigen im Laden auf ein Brot und möchten es haben. Was sagen Sie?
    en: In a shop you point at a loaf of bread and want it. What do you say?
  answer:
  - Дайте, будь ласка, оце.
  options:
  - Дайте, будь ласка, оце.
  - Як це пишеться?
  - Повторіть, будь ласка.
  - Я не знаю.
- id: say-3
  facet: say
  format: type
  prompt:
    de: 'Sie zeigen auf etwas: „Geben Sie mir bitte das da.“ Ergänzen Sie.'
    en: 'You point at something: “Please give me that one.” Complete.'
  stem: ___, будь ласка, оце.
  cue: дати (Sie-Form)
  answer:
  - Дайте
