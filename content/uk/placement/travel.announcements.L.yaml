items:
- id: train-1
  facet: train
  format: choice
  prompt:
    de: Wohin fährt der Zug?
    en: Where is the train going?
  audio: Потяг Київ — Львів відправляється з другої колії о дев'ятій двадцять.
  answer:
    de:
    - Lwiw
    en:
    - Lviv
  options:
    de:
    - Lwiw
    - Kyjiw
    - Odesa
    - Charkiw
    en:
    - Lviv
    - Kyiv
    - Odesa
    - Kharkiv
- id: train-2
  facet: train
  format: choice
  prompt:
    de: Was passiert mit dem Zug 43?
    en: What is happening with train 43?
  audio: Увага! Потяг номер сорок три Одеса — Харків прибуває на п'яту колію.
  answer:
    de:
    - Er kommt an
    en:
    - It is arriving
  options:
    de:
    - Er kommt an
    - Er fährt ab
    - Er hat Verspätung
    - Er fällt aus
    en:
    - It is arriving
    - It is leaving
    - It is delayed
    - It is cancelled
- id: train-3
  facet: train
  format: choice
  prompt:
    de: Welcher Zug hat Verspätung?
    en: Which train is delayed?
  audio: Потяг до Ужгорода затримується на тридцять хвилин.
  answer:
    de:
    - Der Zug nach Uschhorod
    en:
    - The train to Uzhhorod
  options:
    de:
    - Der Zug nach Uschhorod
    - Der Zug nach Lwiw
    - Der Zug aus Uschhorod
    - Der Zug nach Odesa
    en:
    - The train to Uzhhorod
    - The train to Lviv
    - The train from Uzhhorod
    - The train to Odesa
- id: platform-1
  facet: platform
  format: type
  prompt:
    de: Von welchem Gleis? (Zahl)
    en: From which track? (number)
  audio: Потяг Київ — Львів відправляється з другої колії о дев'ятій двадцять.
  answer:
  - '2'
- id: platform-2
  facet: platform
  format: type
  prompt:
