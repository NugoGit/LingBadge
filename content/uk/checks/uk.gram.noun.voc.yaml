enabler: uk.gram.noun.voc
lang: uk
facets:
- id: hard
  band: core
  format: type
  rule: {de: "-а → -о (Олена → Олено), harter Konsonant → -е (Іван → Іване, пан → пане)", en: "-а → -о (Олена → Олено), hard consonant → -е (Іван → Іване, пан → пане)"}
  instruction: {de: "Sprich die Person an: Setze die richtige Form ein.", en: "Address the person: put in the right form."}
- id: soft
  band: variant
  format: type
  rule: {de: "-я, -й, -ь und -р (weich) → -ю (Оля → Олю, Андрій → Андрію, Ігор → Ігорю); -о → -е (Петро → Петре)", en: "-я, -й, -ь and soft -р → -ю (Оля → Олю, Андрій → Андрію, Ігор → Ігорю); -о → -е (Петро → Петре)"}
  instruction: {de: "Sprich die Person an: Setze die richtige Form ein.", en: "Address the person: put in the right form."}
- id: special
  band: exception
  format: type
  rule: {de: "Besondere Formen: друг → друже, тато → тату, Марія → Маріє; пані bleibt", en: "Special forms: друг → друже, тато → тату, Марія → Маріє; пані stays"}
  instruction: {de: "Sprich die Person an: Setze die richtige Form ein.", en: "Address the person: put in the right form."}
- id: voc-or-nom
  band: contrast
  format: choice
  rule: {de: "Vokativ nur bei direkter Anrede; über jemanden sprechen → Nominativ", en: "Vocative only when addressing someone; talking about someone → nominative"}
  instruction: {de: "Welche Form passt?", en: "Which form fits?"}
