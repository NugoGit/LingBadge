enabler: uk.gram.noun.loc-sg
lang: uk
facets:
- id: ending-i
  band: core
  format: type
  rule: {de: "Lokativ auf -і: школа → у школі, кухня → на кухні, місто → у місті, магазин → у магазині", en: "Locative in -і: школа → у школі, кухня → на кухні, місто → у місті, магазин → у магазині"}
  instruction: {de: "Setze das Wort in der richtigen Form ein.", en: "Put the word in the right form."}
- id: alternation-cons
  band: variant
  format: type
  rule: {de: "к → ц, г → з, х → с vor -і: аптека → в аптеці, Прага → у Празі", en: "к → ц, г → з, х → с before -і: аптека → в аптеці, Прага → у Празі"}
  instruction: {de: "Setze das Wort in der richtigen Form ein.", en: "Put the word in the right form."}
- id: alternation-vowel
  band: variant
  format: type
  rule: {de: "і → о/е im Stamm: стіл → на столі, Київ → у Києві, Львів → у Львові", en: "і → о/е in the stem: стіл → на столі, Київ → у Києві, Львів → у Львові"}
  instruction: {de: "Setze das Wort in der richtigen Form ein.", en: "Put the word in the right form."}
- id: masc-u
  band: variant
  format: type
  rule: {de: "Viele Maskulina auf -у/-ю: у банку, в парку, на Хрещатику", en: "Many masculines take -у/-ю: у банку, в парку, на Хрещатику"}
  instruction: {de: "Setze das Wort in der richtigen Form ein.", en: "Put the word in the right form."}
- id: indeclinable
  band: exception
  format: type
  rule: {de: "Unveränderliche Wörter: кафе, метро, кіно, таксі, радіо", en: "Indeclinable words: кафе, метро, кіно, таксі, радіо"}
  instruction: {de: "Setze das Wort in der richtigen Form ein.", en: "Put the word in the right form."}
- id: u-vs-na
  band: contrast
  format: choice
  options: [у/в, на]
  rule: {de: "на bei Orten wie пошта, вокзал, робота, концерт, зупинка, вулиця; sonst у/в", en: "на with places like пошта, вокзал, робота, концерт, зупинка, вулиця; otherwise у/в"}
  instruction: {de: "у/в oder на?", en: "у/в or на?"}
