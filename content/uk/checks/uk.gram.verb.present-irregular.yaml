enabler: uk.gram.verb.present-irregular
lang: uk
facets:
- id: mohty-khotity
  band: core
  format: type
  rule: {de: "могти → можу, можеш …; хотіти → хочу, хочеш …", en: "могти → можу, можеш …; хотіти → хочу, хочеш …"}
  instruction: {de: "Setze das Verb in der richtigen Form ein.", en: "Put the verb in the right form."}
- id: pyty
  band: core
  format: type
  rule: {de: "пити → п'ю, п'єш, п'є, п'ємо, п'єте, п'ють", en: "пити → п'ю, п'єш, п'є, п'ємо, п'єте, п'ють"}
  instruction: {de: "Setze das Verb in der richtigen Form ein.", en: "Put the verb in the right form."}
- id: ity-yikhaty
  band: variant
  format: type
  rule: {de: "іти → іду/йду, ідеш/йдеш …; їхати → їду, їдеш …", en: "іти → іду/йду, ідеш/йдеш …; їхати → їду, їдеш …"}
  instruction: {de: "Setze das Verb in der richtigen Form ein.", en: "Put the verb in the right form."}
- id: yisty
  band: exception
  format: type
  rule: {de: "їсти → їм, їси, їсть, їмо, їсте, їдять", en: "їсти → їм, їси, їсть, їмо, їсте, їдять"}
  instruction: {de: "Setze das Verb in der richtigen Form ein.", en: "Put the verb in the right form."}
- id: ye
  band: exception
  format: type
  rule: {de: "бути im Präsens: є (für alle Personen)", en: "бути in the present: є (all persons)"}
  instruction: {de: "Setze das Verb in der richtigen Form ein.", en: "Put the verb in the right form."}
