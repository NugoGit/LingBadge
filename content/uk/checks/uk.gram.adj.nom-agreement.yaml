enabler: uk.gram.adj.nom-agreement
lang: uk
facets:
- id: hard
  band: core
  format: type
  rule: {de: "Harte Adjektive: -ий, -а, -е, -і (новий, нова, нове, нові)", en: "Hard adjectives: -ий, -а, -е, -і (новий, нова, нове, нові)"}
  instruction: {de: "Setze das Adjektiv in der richtigen Form ein.", en: "Put the adjective in the right form."}
- id: soft
  band: variant
  format: type
  rule: {de: "Weiche Adjektive: -ій, -я, -є, -і (синій, синя, синє, сині)", en: "Soft adjectives: -ій, -я, -є, -і (синій, синя, синє, сині)"}
  instruction: {de: "Setze das Adjektiv in der richtigen Form ein.", en: "Put the adjective in the right form."}
- id: misleading-noun
  band: exception
  format: type
  rule: {de: "Das Genus des Nomens zählt, nicht die Endung: тато, Микола → -ий; кафе, ім'я → -е; ніч, сіль → -а", en: "The noun's gender counts, not its ending: тато, Микола → -ий; кафе, ім'я → -е; ніч, сіль → -а"}
  instruction: {de: "Setze das Adjektiv in der richtigen Form ein.", en: "Put the adjective in the right form."}
