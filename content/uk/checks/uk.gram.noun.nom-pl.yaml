enabler: uk.gram.noun.nom-pl
lang: uk
facets:
- id: hard
  band: core
  format: type
  rule: {de: "Harte Stämme: Mask./Fem. → -и (студенти, школи), Neutra -о → -а (міста)", en: "Hard stems: masc./fem. → -и (студенти, школи), neuters -о → -а (міста)"}
  instruction: {de: "Setze das Wort im Plural ein.", en: "Put the word in the plural."}
- id: soft
  band: variant
  format: type
  rule: {de: "Weiche Stämme und ж, ч, ш, щ → -і (кухні, вчителі, ключі), nach Vokal → -ї (музеї), Neutra -е → -я (моря)", en: "Soft stems and ж, ч, ш, щ → -і (кухні, вчителі, ключі), after a vowel → -ї (музеї), neuters -е → -я (моря)"}
  instruction: {de: "Setze das Wort im Plural ein.", en: "Put the word in the plural."}
- id: stem-change
  band: variant
  format: type
  rule: {de: "Stammwechsel: і → о (стіл → столи, рік → роки), flüchtiges е/о (день → дні)", en: "Stem change: і → о (стіл → столи, рік → роки), fleeting е/о (день → дні)"}
  instruction: {de: "Setze das Wort im Plural ein.", en: "Put the word in the plural."}
- id: irregular
  band: exception
  format: type
  rule: {de: "Unregelmäßig: людина → люди, дитина → діти, друг → друзі, око → очі", en: "Irregular: людина → люди, дитина → діти, друг → друзі, око → очі"}
  instruction: {de: "Setze das Wort im Plural ein.", en: "Put the word in the plural."}
