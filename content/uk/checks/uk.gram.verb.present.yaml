enabler: uk.gram.verb.present
lang: uk
facets:
- id: conj1
  band: core
  format: type
  rule: {de: "1. Konjugation: -ю, -єш, -є, -ємо, -єте, -ють (читати → читаю)", en: "1st conjugation: -ю, -єш, -є, -ємо, -єте, -ють (читати → читаю)"}
  instruction: {de: "Setze das Verb in der richtigen Form ein.", en: "Put the verb in the right form."}
- id: conj2
  band: core
  format: type
  rule: {de: "2. Konjugation: -ю/-у, -иш, -ить, -имо, -ите, -ять/-ать (говорити → говорю)", en: "2nd conjugation: -ю/-у, -иш, -ить, -имо, -ите, -ять/-ать (говорити → говорю)"}
  instruction: {de: "Setze das Verb in der richtigen Form ein.", en: "Put the verb in the right form."}
- id: uvaty
  band: variant
  format: type
  rule: {de: "-увати/-ювати → -ую/-юю (працювати → працюю)", en: "-увати/-ювати → -ую/-юю (працювати → працюю)"}
  instruction: {de: "Setze das Verb in der richtigen Form ein.", en: "Put the verb in the right form."}
- id: conj2-alternation
  band: variant
  format: type
  rule: {de: "2. Konjugation, 1. Person Sg.: д → дж, т → ч, с → ш; б, п, в, м + л (ходжу, плачу, прошу, люблю)", en: "2nd conjugation, 1st person sg.: д → дж, т → ч, с → ш; б, п, в, м + л (ходжу, плачу, прошу, люблю)"}
  instruction: {de: "Setze das Verb in der richtigen Form ein.", en: "Put the verb in the right form."}
- id: stem-change
  band: exception
  format: type
  rule: {de: "Stammwechsel: писати → пишу, жити → живу, брати → беру, вставати → встаю", en: "Stem change: писати → пишу, жити → живу, брати → беру, вставати → встаю"}
  instruction: {de: "Setze das Verb in der richtigen Form ein.", en: "Put the verb in the right form."}
- id: agreement
  band: contrast
  format: type
  rule: {de: "Die Form richtet sich nach dem Subjekt: ми з братом = wir, ви (höflich) = 2. Pl., хто = 3. Sg.", en: "The form follows the subject: ми з братом = we, ви (polite) = 2nd pl., хто = 3rd sg."}
  instruction: {de: "Setze das Verb in der richtigen Form ein. Achte auf das Subjekt.", en: "Put the verb in the right form. Watch the subject."}
