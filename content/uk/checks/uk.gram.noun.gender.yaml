# Gender is tested the Ukrainian way: which pronoun replaces the noun.
enabler: uk.gram.noun.gender
lang: uk
facets:
- id: by-ending
  band: core
  format: choice
  options: [він, вона, воно]
  rule: {de: "Konsonant → він, -а → вона, -о/-е → воно", en: "consonant → він, -а → вона, -о/-е → воно"}
  instruction: {de: "Welches Pronomen ersetzt das Nomen?", en: "Which pronoun replaces the noun?"}
- id: soft
  band: variant
  format: choice
  options: [він, вона, воно]
  rule: {de: "-я meist вона, aber -ння/-ття → воно; -ь kann він (день) oder вона (ніч) sein", en: "-я is usually вона, but -ння/-ття → воно; -ь can be він (день) or вона (ніч)"}
  instruction: {de: "Welches Pronomen ersetzt das Nomen?", en: "Which pronoun replaces the noun?"}
- id: against-ending
  band: exception
  format: choice
  options: [він, вона, воно]
  rule: {de: "Gegen die Endung: тато, дядько, Микола → він; кафе, ім'я → воно; мати → вона", en: "Against the ending: тато, дядько, Микола → він; кафе, ім'я → воно; мати → вона"}
  instruction: {de: "Welches Pronomen ersetzt das Nomen?", en: "Which pronoun replaces the noun?"}
items:
