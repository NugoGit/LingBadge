enabler: uk.gram.noun.acc-sg
lang: uk
facets:
- id: fem-a
  band: core
  format: type
  rule: {de: "Feminina -а → -у, -я → -ю: кава → каву, пісня → пісню", en: "Feminines -а → -у, -я → -ю: кава → каву, пісня → пісню"}
  instruction: {de: "Setze das Wort in der richtigen Form ein.", en: "Put the word in the right form."}
- id: inanimate
  band: core
  format: type
  rule: {de: "Unbelebte Maskulina und Neutra bleiben wie im Nominativ: суп → суп, молоко → молоко", en: "Inanimate masculines and neuters stay as in the nominative: суп → суп, молоко → молоко"}
  instruction: {de: "Setze das Wort in der richtigen Form ein.", en: "Put the word in the right form."}
- id: animate-masc
  band: variant
  format: type
  rule: {de: "Belebte Maskulina auf -а/-я (wie Genitiv): брат → брата, вчитель → вчителя", en: "Animate masculines take -а/-я (like the genitive): брат → брата, вчитель → вчителя"}
  instruction: {de: "Setze das Wort in der richtigen Form ein.", en: "Put the word in the right form."}
- id: special
  band: exception
  format: type
  rule: {de: "Besondere Fälle: тато → тата, кіт → кота, Микола → Миколу, таксі bleibt", en: "Special cases: тато → тата, кіт → кота, Микола → Миколу, таксі stays"}
  instruction: {de: "Setze das Wort in der richtigen Form ein.", en: "Put the word in the right form."}
- id: animate-or-not
  band: contrast
  format: choice
  rule: {de: "Belebt (Person, Tier) → -а/-я; unbelebt → wie Nominativ", en: "Animate (person, animal) → -а/-я; inanimate → as nominative"}
  instruction: {de: "Welche Form passt?", en: "Which form fits?"}
