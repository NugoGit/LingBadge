# у/в, і/й, з/зі (Правопис 2019, § 23-25). Only clear-cut contexts: no consonant + vowel cases for у/в.
enabler: uk.phon.euphony
lang: uk
facets:
- id: uv-consonants
  band: core
  format: choice
  options: [у, в]
  rule: {de: "у zwischen Konsonanten und am Satzanfang vor Konsonant", en: "у between consonants and at the start of a sentence before a consonant"}
  instruction: {de: "у oder в?", en: "у or в?"}
- id: uv-vowels
  band: core
  format: choice
  options: [у, в]
  rule: {de: "в nach Vokal (vor Konsonant oder Vokal)", en: "в after a vowel (before a consonant or a vowel)"}
  instruction: {de: "у oder в?", en: "у or в?"}
- id: uv-start-vowel
  band: variant
  format: choice
  options: [у, в]
  rule: {de: "в am Satzanfang vor Vokal", en: "в at the start of a sentence before a vowel"}
  instruction: {de: "у oder в?", en: "у or в?"}
- id: uv-before-v-f
  band: exception
  format: choice
  options: [у, в]
  rule: {de: "immer у vor в, ф und vor льв, св, тв, хв", en: "always у before в, ф and before льв, св, тв, хв"}
  instruction: {de: "у oder в?", en: "у or в?"}
- id: i-y
  band: variant
  format: choice
  options: [і, й]
  rule: {de: "й nach Vokal vor Konsonant, і zwischen Konsonanten", en: "й after a vowel before a consonant, і between consonants"}
  instruction: {de: "і oder й?", en: "і or й?"}
- id: i-before-iotated
  band: exception
  format: choice
  options: [і, й]
  rule: {de: "immer і vor я, ю, є, ї, й", en: "always і before я, ю, є, ї, й"}
  instruction: {de: "і oder й?", en: "і or й?"}
- id: z-zi
  band: variant
  format: choice
  options: [з, зі]
  rule: {de: "зі vor мною und vor Gruppen wie зл, сп, шк; sonst з", en: "зі before мною and clusters like зл, сп, шк; otherwise з"}
  instruction: {de: "з oder зі?", en: "з or зі?"}
