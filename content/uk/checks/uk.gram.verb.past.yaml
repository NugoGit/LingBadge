enabler: uk.gram.verb.past
lang: uk
facets:
- id: regular
  band: core
  format: type
  rule: {de: "Infinitivstamm + -в (er), -ла (sie), -ло (es), -ли (Plural): читав, читала, читало, читали", en: "Infinitive stem + -в (he), -ла (she), -ло (it), -ли (plural): читав, читала, читало, читали"}
  instruction: {de: "Setze das Verb im Präteritum ein.", en: "Put the verb in the past tense."}
- id: speaker
  band: variant
  format: type
  rule: {de: "Bei я/ти entscheidet das Geschlecht der Person: я була (Frau), я був (Mann)", en: "With я/ти the person's gender decides: я була (woman), я був (man)"}
  instruction: {de: "Setze das Verb im Präteritum ein. Wer spricht, steht vorne.", en: "Put the verb in the past tense. The speaker is named first."}
- id: irregular
  band: exception
  format: type
  rule: {de: "Unregelmäßig: могти → міг, могла; їсти → їв, їла; піти → пішов, пішла", en: "Irregular: могти → міг, могла; їсти → їв, їла; піти → пішов, пішла"}
  instruction: {de: "Setze das Verb im Präteritum ein.", en: "Put the verb in the past tense."}
- id: agreement
  band: contrast
  format: type
  rule: {de: "Form nach dem Subjekt: ви (auch höflich) → -ли, кафе/місто → -ло, ohne Subjekt (холодно) → -ло", en: "Form follows the subject: ви (also polite) → -ли, кафе/місто → -ло, no subject (холодно) → -ло"}
  instruction: {de: "Setze das Verb im Präteritum ein. Achte auf das Subjekt.", en: "Put the verb in the past tense. Watch the subject."}
