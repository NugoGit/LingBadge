# Test templates per mode. The generator fills one template per form, from the skill (can-do),
# the realization (phrases, enablers, word lists, register, variety) and a seed.
# Shared constraints (all templates):
#   - instruction language = learner setting (default en); target-language text only in stimuli and answers
#   - every item / content point / required move is tagged with the enablers it exercises
#   - stimulus words outside the realization's word lists: allowed for realism, max 15% of tokens,
#     and no key, content point or required move may depend on them
#   - a new form must differ from every form the learner has seen for this skill (5-gram Jaccard < 0.3)
#   - every form passes the validator prompt before it is shown

templates:
  - id: reading.v1
    modes: [R]
    rubric: rubric.reading.v1
    stimulus: >
      One realistic document of the kind the skill names (menu, sign set, timetable, poster, forecast,
      store guide, short message or illustrated text), 40-150 words, laid out as the real thing would be.
    items: {count: 10, mix: {mcq: 6, short_answer: 4}, mcq_options: 4}
    rules:
      - Each item has exactly one defensible answer; short answers list every accepted variant in the key.
      - No item can be answered from world knowledge alone.
      - Items cover different parts of the document; at most 2 items need arithmetic.
      - Questions in the instruction language; short answers may be numbers, or words copied from the text.
    time_limit_min: 10

  - id: listening.v1
    modes: [L]
    rubric: rubric.listening.v1
    stimulus: >
      Either 8-10 short clips (one utterance each) or one 60-120 second monologue or dialogue,
      written as a script and rendered with TTS. Speech rate 0.85, natural pauses between clips.
    playback: {plays: 2, speed: 0.85}
    items: {count: 10, mix: {mcq: 4, short_answer: 6}, mcq_options: 4}
    rules:
      - Number answers are compared as digits; times accept 24h and 12h forms.
      - Each item depends on one clip or one clearly separated part of the script.
    note: TTS until real recordings exist. Phonology enablers stay untested by TTS forms.

  - id: written-interaction.v1
    modes: [WI]
    rubric: rubric.written-interaction.v1
    stimulus: >
      Optional incoming message the learner answers (20-60 words, informal or formal per realization),
      or a form to fill in, or a situation description in the instruction language.
    brief: {content_points: 4-6, must_points: 3-5}
    word_range: [20, 60]
    rules:
      - Content points name what to communicate, never the target-language words for it.
      - At least two content points require the realization's key structures.
      - For forms: give the learner a fictional identity card in the instruction language.
    time_limit_min: 15

  - id: written-production.v1
    modes: [WP]
    rubric: rubric.written-production.v1
    stimulus: Situation and audience in the instruction language.
    brief: {content_points: 3-5, must_points: 3}
    word_range: [30, 80]
    note: No A1 skill uses it; kept for A2+.

  - id: roleplay.v1
    modes: [SI]
    rubric: rubric.interaction.v1
    script:
      persona: Who the interlocutor is (e.g. waiter in a cafe in Lviv)
      setting: Where and when, one sentence
      register: formal | informal (from the realization)
      learner_goal: What the learner must achieve, in the instruction language
      required_moves: 4-7 moves the learner must make, each tagged with enablers
      complications: 1-2 sampled by seed from the template pool below plus skill-specific ones
      opening_line: First interlocutor line, in the target language
      max_turns: 12
    complication_pool:
      - The item asked for is not available.
      - The interlocutor asks a follow-up question (size, quantity, with or without something).
      - The interlocutor misunderstands one detail and the learner must correct it.
      - The interlocutor speaks a bit too fast once; the learner must ask for repetition.
    channel: typed for now (heatmap only); speech later
    note: The interlocutor and the grader are separate calls; the interlocutor never grades or corrects.

  - id: spoken-production.v1
    modes: [SP]
    rubric: rubric.spoken-production.v1
    stimulus: Brief with 3-5 content points; 1 minute to prepare.
    channel: speech (later); typed rehearsal allowed for practice, never for badges

  - id: enabler-check.v1
    for: enablers
    items: {count: 10, types: [gap_fill, transform, mcq]}
    rules:
      - Every item is a short, natural sentence from an A1 situation; the target form is the only gap.
      - Items cover the enabler's sub-cases evenly (e.g. genitive -а and -у, hard and soft stems).
      - Lexis checks: 12 items, meaning to word and word to meaning, from the enabler's word list.
    threshold: 0.9

  - id: probe.v1
    for: placement
    items: {count: 3}
    rules:
      - Three items drawn from the skill's full template, the most diagnostic ones.
      - "Outcome: 3/3 likely, 2/3 shaky, 0-1/3 unknown. Probes never count toward a badge."
