- id: ukstd.A1.theme.daily
  origin: ukstd
  text: 'Daily life: routine, everyday objects, clock times.'
- id: ukstd.A1.theme.work-leisure
  origin: ukstd
  text: 'Work and leisure: workday, day off, lunch break, hobbies, sports facilities.'
- id: ukstd.A1.theme.travel
  origin: ukstd
  text: 'Travel: station, airport, border, movement, parts of the world, sights.'
- id: ukstd.A1.theme.shopping
  origin: ukstd
  text: 'Shopping: food, hygiene items, stationery, weights and volumes, money.'
- id: ukstd.A1.theme.restaurant
  origin: ukstd
  text: Restaurant basics.
- id: ukstd.A1.theme.health
  origin: ukstd
  text: Health and pharmacy.
- id: ukstd.A1.theme.weather
  origin: ukstd
  text: Weather.
- id: ukstd.A1.theme.plants-animals
  origin: ukstd
  text: Simple plants and animals.
- id: ukstd.A1.theme.holidays
  origin: ukstd
  text: Holidays, birthdays, gifts.
