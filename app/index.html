<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LingBadge – Kompetenzkarte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,650&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: a scan-first grid of real-life skills (theme × mode), with test runs taking over the main column. */
  --bg: #f4f5f2;
  --surface: #ffffff;
  --ink: #1d2328;
  --muted: #5d666e;
  --line: #d9ddd8;
  --accent: #24508f;
  --accent-soft: #e3eaf5;
  --s-badge: #1f6b45;  --s-badge-bg: #d4ecdf;
  --s-likely: #3d7a3a; --s-likely-bg: #e6f2df;
  --s-shaky: #8a5a00;  --s-shaky-bg: #fbecc8;
  --s-gap: #a3352c;    --s-gap-bg: #f8dcd8;
  --s-none: #6b7278;   --s-none-bg: #eceeeb;
  --font-display: "Literata", Georgia, serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15191c; --surface: #1d2226; --ink: #e6e9ea; --muted: #9aa3a9; --line: #333b40;
    --accent: #8db1ec; --accent-soft: #23314a;
    --s-badge: #7fd1a4; --s-badge-bg: #183a29; --s-likely: #a6d79c; --s-likely-bg: #22331f;
    --s-shaky: #f0c46a; --s-shaky-bg: #3d3018; --s-gap: #f2a197; --s-gap-bg: #44221f; --s-none: #a3aab0; --s-none-bg: #262c30;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15191c; --surface: #1d2226; --ink: #e6e9ea; --muted: #9aa3a9; --line: #333b40;
  --accent: #8db1ec; --accent-soft: #23314a;
  --s-badge: #7fd1a4; --s-badge-bg: #183a29; --s-likely: #a6d79c; --s-likely-bg: #22331f;
  --s-shaky: #f0c46a; --s-shaky-bg: #3d3018; --s-gap: #f2a197; --s-gap-bg: #44221f; --s-none: #a3aab0; --s-none-bg: #262c30;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); }
a { color: var(--accent); }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 650; text-wrap: balance; margin: 0; }
h1 { font-size: 1.45rem; } h2 { font-size: 1.2rem; } h3 { font-size: 1.02rem; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px 48px; }
header.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 24px; padding: 18px 0 12px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
header.top .sub { color: var(--muted); font-size: .9rem; }
nav.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
nav.tabs a { text-decoration: none; color: var(--muted); padding: 6px 10px; border-radius: 6px; font-weight: 500; }
nav.tabs a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.note { background: var(--s-shaky-bg); color: var(--ink); border-left: 3px solid var(--s-shaky); padding: 8px 12px; border-radius: 4px; margin: 0 0 16px; font-size: .92rem; }
.note.info { background: var(--accent-soft); border-color: var(--accent); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 18px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.tile b { display: block; font: 600 1.5rem/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.tile span { color: var(--muted); font-size: .85rem; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: .85rem; margin-bottom: 14px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 2px 9px; font-size: .78rem; font-weight: 600; white-space: nowrap; border: 1px solid transparent; }
.st-badge { background: var(--s-badge-bg); color: var(--s-badge); border-color: var(--s-badge); }
.st-likely, .st-known { background: var(--s-likely-bg); color: var(--s-likely); }
.st-shaky, .st-suspect { background: var(--s-shaky-bg); color: var(--s-shaky); }
.st-suspect { border: 1px dashed var(--s-shaky); }
.st-unknown { background: var(--s-gap-bg); color: var(--s-gap); }
.st-untested, .st-audio { background: var(--s-none-bg); color: var(--s-none); }
.theme { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 14px; overflow-x: auto; }
.theme h2 { padding: 10px 14px 6px; font-size: 1.05rem; }
table.grid { width: 100%; border-collapse: collapse; min-width: 640px; }
table.grid th { font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; text-align: left; padding: 4px 10px; }
table.grid td { border-top: 1px solid var(--line); padding: 6px 10px; vertical-align: middle; }
table.grid td.task { width: 38%; }
table.grid td.task small { color: var(--muted); display: block; font-size: .78rem; }
.cellbtn { background: none; border: 0; padding: 0; cursor: pointer; }
.cellbtn .chip { cursor: pointer; }
.cellbtn:hover .chip { filter: brightness(.96); text-decoration: underline; }
.dot { color: var(--line); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.stack { display: grid; gap: 10px; }
.btn { background: var(--accent); color: #fff; border: 0; border-radius: 7px; padding: 8px 14px; font-weight: 600; cursor: pointer; }
:root[data-theme="dark"] .btn { color: #0f1620; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn { color: #0f1620; } }
.btn.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
.btn.quiet { background: transparent; color: var(--muted); border: 1px solid var(--line); }
.btn:disabled { opacity: .5; cursor: default; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.doc { white-space: pre-wrap; font-family: var(--font-body); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; line-height: 1.6; }
.msg { background: var(--accent-soft); border-radius: 12px 12px 12px 3px; padding: 10px 14px; max-width: 520px; white-space: pre-wrap; }
.item { border-top: 1px solid var(--line); padding: 12px 0; display: grid; gap: 6px; }
.item:first-child { border-top: 0; }
.item .q { font-weight: 500; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
.item .instr { flex-basis: 100%; font-weight: 400; font-size: .85rem; color: var(--muted); }
.item .ctx { flex-basis: 100%; font-weight: 400; font-style: italic; }
.stem { font-size: 1.05rem; }
.gap { display: inline-block; min-width: 2.5em; border-bottom: 2px solid var(--muted); color: transparent; }
.cue { color: var(--muted); font-weight: 400; }
td .instr { display: none; }
td .ctx { display: block; font-size: .8rem; color: var(--muted); }
td .gap { color: var(--muted); }
.langpick { margin-left: auto; }
.langpick select { font: inherit; padding: 2px 6px; }
[dir=rtl] { text-align: right; }
.opts { display: grid; gap: 4px; }
.opts label { display: flex; gap: 8px; align-items: baseline; cursor: pointer; }
input[type="text"], textarea, select { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; width: 100%; max-width: 520px; }
textarea { min-height: 140px; max-width: 100%; }
.keys { display: flex; gap: 4px; flex-wrap: wrap; }
.keys button { border: 1px solid var(--line); background: var(--surface); border-radius: 5px; padding: 2px 9px; cursor: pointer; font-size: .95rem; }
.chat { display: grid; gap: 8px; max-height: 420px; overflow-y: auto; padding: 4px; }
.item > .bubble { justify-self: start; }
.bubble { padding: 8px 12px; border-radius: 12px; max-width: 80%; white-space: pre-wrap; }
.bubble.them { background: var(--accent-soft); justify-self: start; border-bottom-left-radius: 3px; }
.bubble.me { background: var(--s-likely-bg); justify-self: end; border-bottom-right-radius: 3px; }
.verdict { border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; display: grid; gap: 4px; }
.verdict.pass { background: var(--s-badge-bg); }
.verdict.fail { background: var(--s-gap-bg); }
.verdict.info { background: var(--s-shaky-bg); }
.verdict b { font: 650 1.2rem var(--font-display); }
table.plain { border-collapse: collapse; width: 100%; font-size: .92rem; }
table.plain th, table.plain td { text-align: left; padding: 6px 8px; border-top: 1px solid var(--line); vertical-align: top; }
table.plain th { color: var(--muted); font-weight: 600; font-size: .8rem; border-top: 0; }
.num { font-variant-numeric: tabular-nums; }
.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.9s linear infinite; vertical-align: -2px; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
.ok { color: var(--s-badge); font-weight: 600; } .bad { color: var(--s-gap); font-weight: 600; }
.ens { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 8px; }
.en { display: flex; justify-content: space-between; gap: 8px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: .9rem; }
.en small { color: var(--muted); display: block; }
code { font-family: var(--font-mono); font-size: .82rem; }
@media (max-width: 480px) { table.grid td.task { width: 50%; } }
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="top"><h1>Kompetenzkarte</h1><span class="sub">wird geladen …</span></header>
  <p class="muted">Lädt …</p>
</div>
<script src="content.js"></script>
<script src="platform.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
